# 南方五省区（粤、桂、黔、滇、琼）多地貌跨省 PipeNetGen 算法泛化核验试验区配置
version: "1.0"
synthetic_disclaimer: "SYNTHETIC_DATA_NOT_REAL_ASSET=true（跨五省 OSM 实测路网 + Copernicus GLO-30 地形算法验证样本）"

road_extraction:
  include_highways: ["trunk", "primary", "secondary", "tertiary", "residential", "unclassified"]
  exclude_highways: ["footway", "cycleway", "path", "steps", "track", "pedestrian"]
  default_spacing_m: 90.0
  snap_tolerance_m: 18.0

topology:
  outfall_buffer_m: 180.0
  uphill_penalty_weight: 200.0
  min_component_nodes: 3

hydraulics:
  storm_formula:
    a1: 15.2
    c: 0.72
    b: 11.0
    n: 0.75
    return_period_yr: 5.0
  inlet_tc_min: 10.0
  assumed_flow_velocity_ms: 1.0
  default_runoff_coeff: 0.68
  tributary_width_m: 90.0
  pipe_manning_n: 0.013
  min_slope: 0.002
  min_cover_m: 1.0
  max_depth_m: 6.0
  nominal_diameters_m: [0.3, 0.4, 0.5, 0.6, 0.8, 1.0, 1.2, 1.5, 1.8, 2.0, 2.4]

