# 宁明县城 PipeNetGen 虚拟雨水管网生成与水力设计配置（遵循 GB 50014 规范）
case: ningming
crs_epsg: 32648
synthetic_disclaimer: "SYNTHETIC_DATA_NOT_REAL_ASSET=true（由 OSM 路网与 DEM 算法推导，非真实市政地下管网资产）"

aoi_wgs84: [107.03, 22.10, 107.12, 22.18]
dem_path: "data/interim/ningming/dem_12p5m_32648.tif"
waterway_path: "data/raw/hydro/ningming/osm_waterways_aoi.geojson"

road_extraction:
  include_highways: ["trunk", "primary", "secondary", "tertiary", "residential", "unclassified"]
  exclude_highways: ["footway", "cycleway", "path", "steps", "track"]
  inlet_spacing_m:
    primary: 50.0
    secondary: 55.0
    tertiary: 65.0
    residential: 75.0
  default_spacing_m: 70.0
  snap_tolerance_m: 15.0

topology:
  outfall_buffer_m: 200.0
  uphill_penalty_weight: 200.0
  min_component_nodes: 3

hydraulics:
  storm_formula:
    a1: 14.5
    c: 0.70
    b: 10.5
    n: 0.76
    return_period_yr: 5.0
  inlet_tc_min: 10.0
  assumed_flow_velocity_ms: 1.0
  runoff_coeff_by_highway:
    primary: 0.80
    secondary: 0.72
    tertiary: 0.65
    residential: 0.60
  default_runoff_coeff: 0.60
  tributary_width_m: 90.0
  pipe_manning_n: 0.013
  min_slope: 0.002
  min_cover_m: 1.0
  max_depth_m: 6.0
  nominal_diameters_m: [0.3, 0.4, 0.5, 0.6, 0.8, 1.0, 1.2, 1.5]
