# 南方五省区（粤、桂、黔、滇、琼）及流域/部委公开水情门户与核验基准配置
version: "1.0"
policy:
  strict_fail_closed: true
  forbid_waf_or_font_bypass: true
  open_glofas_api: "https://flood-api.open-meteo.com/v1/flood"

portals:
  - province: "海南"
    province_code: "hainan"
    endpoints:
      - id: "hainan_swt_daily"
        url: "https://swt.hainan.gov.cn/"
        kind: "html_daily_bulletin"
        parser: "hainan_daily_homepage"
        note: "海南省水务厅首页明文【每日水雨情】，公开10座大型水库与3条主要江河水位"
      - id: "hainan_xqfb_sqmap"
        url: "http://36.101.208.40/xqfb/sq_map.asp"
        kind: "asp_marker_table"
        parser: "hainan_sqmap_thresholds"
        note: "省水务厅官网直链三防实时水情网，内嵌全岛测站警戒/保证水位及超限表"
      - id: "hainan_sqjb_list"
        url: "https://swt.hainan.gov.cn/sswt/sqjb/slist.shtml?ddtab=true"
        kind: "html_bulletin_index"
        parser: "generic_link_index"
        note: "海南水情简报历史发布列表（含台风过程简报）"

  - province: "广西"
    province_code: "guangxi"
    endpoints:
      - id: "guangxi_slt_emergency"
        url: "http://slt.gxzf.gov.cn/fxkh_40990/lsyjxx/yjxy/"
        kind: "html_emergency_timeline"
        parser: "guangxi_emergency_responses"
        note: "广西水利厅洪水防御应急响应通报，记录2026-08台风紫檀/郁江超警与退警起止时间窗"
      - id: "guangxi_slt_jbgb"
        url: "http://slt.gxzf.gov.cn/zfxxgk/xxgknr/jbgb/"
        kind: "html_bulletin_index"
        parser: "generic_link_index"
        note: "广西水利厅数据发布（水资源公报、水旱灾害公报）"
      - id: "guangxi_opendata_portal"
        url: "https://data.gxzf.gov.cn/"
        kind: "login_gated_opendata"
        parser: "status_only"
        note: "重定向至 gxsjkf.dsjfzj.gxzf.gov.cn:8183，需账号登录并申请AppKey方可下载水库/玉林河道水情"

  - province: "广东"
    province_code: "guangdong"
    endpoints:
      - id: "guangdong_slt_http"
        url: "http://slt.gd.gov.cn/"
        kind: "html_bulletin_index"
        parser: "generic_link_index"
        note: "广东省水利厅HTTP门户（HTTPS同址当前返回500）；含水文局动态与防汛新闻"
      - id: "guangdong_gdsswj"
        url: "http://slt.gd.gov.cn/zsdw_2021/gdsswj/"
        kind: "html_bulletin_index"
        parser: "generic_link_index"
        note: "广东省水文局专栏"
      - id: "guangdong_opendata_portal"
        url: "https://gddata.gd.gov.cn/"
        kind: "login_gated_opendata"
        parser: "status_only"
        note: "开放广东平台，水利/水文数据集需注册申请授权后下载"

  - province: "贵州"
    province_code: "guizhou"
    endpoints:
      - id: "guizhou_opendata_portal"
        url: "https://data.guizhou.gov.cn/"
        kind: "login_gated_opendata"
        parser: "status_only"
        note: "贵州省政府数据开放平台，含无条件开放类【水情信息数据】接口（需账号申请调用）"
      - id: "guizhou_slt_portal"
        url: "https://sl.gz.gov.cn/"
        kind: "tls_or_gateway_restricted"
        parser: "status_only"
        note: "贵州省水利厅官网（TLS握手外部直连常受限）"

  - province: "云南"
    province_code: "yunnan"
    endpoints:
      - id: "yunnan_swj_portal"
        url: "http://www.ynswj.cn/"
        kind: "html_bulletin_index"
        parser: "generic_link_index"
        note: "云南省水文水资源局官网（公开水文新闻、中小河流预警动态）"
      - id: "yunnan_wcb_portal"
        url: "https://wcb.yn.gov.cn/"
        kind: "html_bulletin_index"
        parser: "generic_link_index"
        note: "云南省水利厅官网（水资源公报、水文业务动态）"
      - id: "yunnan_opendata_portal"
        url: "https://data.yn.gov.cn/"
        kind: "login_gated_opendata"
        parser: "status_only"
        note: "云南省一体化公共数据平台（需账号授权）"

  - province: "部委与流域（参考）"
    province_code: "basin_national"
    endpoints:
      - id: "mwr_xxfb"
        url: "http://xxfb.mwr.cn/hydroSearch/greatRiver"
        kind: "obfuscated_fonttag"
        parser: "status_only"
        note: "水利部全国水雨情网启用 #FontTag 字体加密，严禁绕过"
      - id: "prwrc_zwswj"
        url: "http://www.zwswj.com/"
        kind: "waf_js_challenge"
        parser: "status_only"
        note: "珠江委水情网返回 HTTP 412 JS 防护，严禁绕过"

# 跨五省代表性河道/水库控制断面（用于公开通报与 GloFAS 日流量连续序列对照核验）
