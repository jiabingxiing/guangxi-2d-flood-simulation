[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gx-hydro2d"
version = "0.1.0"
description = "广西久隆/宁明/贵港二维水动力洪涝模拟项目"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "rasterio>=1.3",
    "psutil>=7.2.2",
    "pyshp>=3.1.6",
    "networkx>=3.2",
    "pyswmm>=2.0",
    "swmmio>=0.8",
]

# 开发依赖用 [dependency-groups]（uv 默认安装，与 floodviz 一致）。
# 原用 [project.optional-dependencies]，需 --extra dev 才装；
# 2026-11-16 实测 `uv sync`（不带 --extra dev）会连带卸载 pytest，
# 改为默认组后 sync 不再破坏测试环境。
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
