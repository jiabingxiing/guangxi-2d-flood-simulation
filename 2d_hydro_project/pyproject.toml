[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gx-hydro2d"
version = "0.1.0"
description = "广西久隆/宁明/贵港二维水动力洪涝模拟项目"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "rasterio>=1.3",
    "psutil>=7.2.2",
    "pyshp>=3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
