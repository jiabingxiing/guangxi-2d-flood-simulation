# CN-China regional adjustment factors (Lian et al., 2020)
# South China subtropical humid red soil shows slightly lower initial loss ratio (lambda ~ 0.05-0.10)
# and adjusted CN values under intense monsoon downpours.
cn_china_adjustment:
  default_lambda: 0.20
  calibrated_lambda: 0.05
  cn_scaling_factor_humid_south: 0.95  # Slightly adjusted retention for well-vegetated red soil hills

# Horton model parameters by HSG (Plan Section 4.3.2)
horton_defaults:
  A: {f0_mm_h: 250.0, fc_mm_h: 25.4, k_h_inv: 2.0}
  B: {f0_mm_h: 200.0, fc_mm_h: 12.7, k_h_inv: 2.0}
  C: {f0_mm_h: 125.0, fc_mm_h: 6.3,  k_h_inv: 2.0}
  D: {f0_mm_h: 76.0,  fc_mm_h: 2.5,  k_h_inv: 2.0}
