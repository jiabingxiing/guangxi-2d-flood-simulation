# South China Red Soil (华南湿润红壤丘陵区) regional calibrated priors (计划 §4.2.3)
south_china_red_soil_priors:
  forest_red_soil:
    description: "林地红壤：植被丰富、根系发达、腐殖层透水好，表层稳渗率显著高于纯基质"
    ks_mm_h: 6.0
    psi_mm: 150.0
    theta_s: 0.48
    theta_fc: 0.32
    theta_wp: 0.18
    hsg: "B"
    effective_depth_m: 1.2

  cropland_red_soil:
    description: "坡耕地/一般旱作红壤：表层有耕作松动但次表层偏黏，压实较易产生地表径流"
    ks_mm_h: 2.2
    psi_mm: 220.0
    theta_s: 0.46
    theta_fc: 0.33
    theta_wp: 0.20
    hsg: "C"
    effective_depth_m: 0.8

  compacted_bare_red_soil:
    description: "压实裸露红壤/施工裸地：结皮硬化严重，入渗能力弱"
    ks_mm_h: 0.8
    psi_mm: 280.0
    theta_s: 0.42
    theta_fc: 0.32
    theta_wp: 0.22
    hsg: "D"
    effective_depth_m: 0.5

  alluvial_lowland_soil:
    description: "河谷冲积壤土/贵港郁江平原区：成土母质为河流冲积物，土层较厚但地下水位较高"
    ks_mm_h: 2.5
    psi_mm: 180.0
    theta_s: 0.47
    theta_fc: 0.35
    theta_wp: 0.19
    hsg: "C"
    effective_depth_m: 0.9

  paddy_wetland:
    description: "水稻田与洼地：犁底层阻水，汛期土壤近饱和，以蓄满产流与溢流为主"
    ks_mm_h: 0.4
    psi_mm: 300.0
    theta_s: 0.50
    theta_fc: 0.42
    theta_wp: 0.26
    hsg: "D"
    effective_depth_m: 0.4

  impervious_built:
    description: "硬化建设用地：不透水面"
    ks_mm_h: 0.0
    psi_mm: 0.0
    theta_s: 0.05
    theta_fc: 0.05
    theta_wp: 0.05
    hsg: "D"
    effective_depth_m: 0.01

  water_body:
    description: "常年水体：直接产流（R_net = P）"
    ks_mm_h: 0.0
    psi_mm: 0.0
    theta_s: 1.00
    theta_fc: 1.00
    theta_wp: 1.00
    hsg: "D"
    effective_depth_m: 0.0
