# Soil hydraulic parameter datasets, texture mappings, and South China red soil priors
datasets:
  hihydrosoil_v2:
    resolution_m: 250
    scale_factor: 0.0001
    ksat_unit_conversion: 0.4166666666666667  # cm/day -> mm/hour (* 10.0 / 24.0)
    layers:
      - {name: "0-5cm", depth_m: 0.05}
      - {name: "5-15cm", depth_m: 0.10}
      - {name: "15-30cm", depth_m: 0.15}
      - {name: "30-60cm", depth_m: 0.30}
      - {name: "60-100cm", depth_m: 0.40}
      - {name: "100-200cm", depth_m: 1.00}
    description: "FutureWater HiHydroSoil v2.0 global 250m soil hydraulic properties"

  china_soil_hydraulics_30s:
    resolution_arcsec: 30
    resolution_approx_km: 0.9
    layers: 7
    max_depth_m: 1.383
    description: "A China Dataset of Soil Hydraulic Parameters Pedotransfer Functions (NCDC / TPDC)"

  china_250m_soil_texture:
    resolution_m: 250
    layers: 6
    survey_period: "2010-2018"
    description: "China high-resolution 250m soil texture grid (CAS Soil Data Center)"

# Hydrologic Soil Groups (HSG) USDA classification
hsg_definitions:
  A:
    description: "High infiltration rate, low runoff potential (sand, loamy sand, sandy loam)"
    ks_min_mm_h: 7.6
    ks_typical_mm_h: 12.0
    cn_baseline_forest: 30
  B:
    description: "Moderate infiltration rate (loam, silt loam)"
    ks_min_mm_h: 3.8
    ks_typical_mm_h: 5.5
    cn_baseline_forest: 55
  C:
    description: "Slow infiltration rate (sandy clay loam, clay loam)"
    ks_min_mm_h: 1.3
    ks_typical_mm_h: 2.5
    cn_baseline_forest: 70
  D:
    description: "Very slow infiltration rate, high runoff potential (clay, silty clay, shallow soil)"
    ks_min_mm_h: 0.0
    ks_typical_mm_h: 0.8
    cn_baseline_forest: 77

