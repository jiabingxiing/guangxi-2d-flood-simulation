# 案例：钦州久隆（500kV 久隆站周边，降级模式情景）
case_id: jiulong
name: 久隆
event_id: "2024-09-yagi"
event_name: "台风摩羯残余环流（2024-09）"
scenario_role: "研究性情景（雨驱动 + 常数潮位带；非独立水动力验证）"
subtitle: "200 m 生产基线 · 21 帧 · 6 h/帧"
model_bbox: [108.545265, 21.92, 108.902171, 22.199335]   # WGS84 西南东北（由模型网格四角变换得到）
crs: "EPSG:32649"
time_zone: "Asia/Shanghai"
time_origin: "2024-09-05T00:00:00+08:00"
origin_status: relative_only_candidate
origin_note: "旧 meta 无规范 t0；该起点来自父项目脚本构造（2024-09-05 00:00 北京时间），仅作显示用；核对冻结雨量/边界/代码哈希前不写入正式时间基准"
default_run_id: scen_free_200m_sv6h

sites:
  - {name: "久隆500kV站", lon: 108.7161, lat: 22.0638, label: "站址（精确坐标待业务确认）"}

# 分层口径（ADR-0010）：
#   raw 层   = 模型原始输出，可一键切回，是唯一有物理意义的层；
#   display_qc 层 = 只读展示派生层，带 not_physical_recalculation=true，不具物理意义。
# 默认层按 ADR-0010 第 2 条取 200 m 生产基线 raw（方案 A）。
# display_qc 待用户确认（计划 §9.3 第 3 条）后才会成为默认层。
runs:
  - run_id: scen_free_200m_sv6h
    label: "200 m 生产基线（T+0–120 h，默认）"
    role: default
    source: "outputs/jiulong/2024-09-yagi/scen_free_200m_sv6h"
    save_interval_s: 21600
    simulation_duration_s: 432000
    notes: "200 m 网格自由出流；雨驱动；海域像元已从淹没统计剔除；河槽未刻蚀（钦江亚像元）。ADR-0010 方案 A 生产治理基线；湿面积 263.24 km²"
  - run_id: scen_free_200m_sv6h_recession
    label: "扩展退水情景（T+0–312 h）"
    role: scenario
    source: "outputs/jiulong/2024-09-yagi/scen_free_200m_sv6h_recession"
    save_interval_s: 21600
    simulation_duration_s: 1123200
    optional: true
    notes: "与默认情景在 T+120 h 前逐位一致；退水期验证为 WEAK，模型面积不降反增（无排水网限制）。display_qc 派生层的源 run"
  - run_id: scen_free_200m_dt2p5_sv6h_recession_ga_v1
    label: "200 m GA 净雨重跑（T+0–312 h）"
    role: scenario
    source: "outputs/jiulong/2024-09-yagi/scen_free_200m_dt2p5_sv6h_recession_ga_v1"
    save_interval_s: 21600
    simulation_duration_s: 1123200
    notes: "Green-Ampt 净雨驱动重跑（GA-Mid：毛雨 242.5 mm、净雨 109.7 mm、Ks 2.58 mm/h）；与扩展退水情景同期长。全周期峰值湿面积 217.60 km²（零损失重跑前 294.36 km²，−26.1%）；S1 假警报像元 −23.5%（execution_status 2026-11-07）。质量门 PASS（mass_recheck_g15.json）"
  - run_id: scen_free_100m_dt2p5_sv6h_realdem
    label: "100 m 敏感性对照（科研诊断，非生产）"
    role: legacy
    source: "outputs/jiulong/2024-09-yagi/scen_free_100m_dt2p5_sv6h_realdem"
    save_interval_s: 21600
    simulation_duration_s: 432000
    optional: true
    notes: "100 m 网格自由出流；雨驱动；严格采用真实DEM。ADR-0010 第 2 条：仅作敏感性对照，不得升级为生产基线；湿面积 271.07 km²"
  - run_id: scen_free_200m_sv6h_recession__display_qc_A
    label: "展示质控层 A 档（保守，只清亚网格碎斑）"
    role: derived
    source: "outputs/display_qc/scen_free_200m_sv6h_recession/A"
    save_interval_s: 21600
    simulation_duration_s: 1123200
    optional: true
    notes: "display_qc 只读展示派生层，not_physical_recalculation=true，不是物理重算。源 run scen_free_200m_sv6h_recession。A 档为最保守档：min_patch_area 0.08 km²、persistence 36 h、shallow 0.10 m。实测 res.max 面积 −0.37% / 水量 −0.03%，单帧最大 1.43%/1.02%，未触发 10% 告警。仅供展示，不得用于物理结论或资产判据"
  - run_id: scen_free_200m_sv6h_recession__display_qc_B
    label: "展示质控层 B 档（中等）"
    role: derived
    source: "outputs/display_qc/scen_free_200m_sv6h_recession/B"
    save_interval_s: 21600
    simulation_duration_s: 1123200
    optional: true
    notes: "display_qc 只读展示派生层，not_physical_recalculation=true。源 run scen_free_200m_sv6h_recession。B 档：min_patch_area 0.16 km²、persistence 36 h。实测 res.max 面积 −0.48% / 水量 −0.05%，单帧最大 2.49%/1.81%。仅供展示"
  - run_id: scen_free_200m_sv6h_recession__display_qc_C
    label: "展示质控层 C 档（激进）"
    role: derived
    source: "outputs/display_qc/scen_free_200m_sv6h_recession/C"
    save_interval_s: 21600
    simulation_duration_s: 1123200
    optional: true
    notes: "display_qc 只读展示派生层，not_physical_recalculation=true。源 run scen_free_200m_sv6h_recession。C 档：min_patch_area 0.36 km²、persistence 54 h。实测 res.max 面积 −0.56% / 水量 −0.06%，单帧最大 3.06%/2.28%。三档均未触发 10% 告警。仅供展示，不得用于物理结论"

# 不合规展示层已退役（ADR-0010 第 8 条），不再列入 runs：
#   scen_free_100m_dt2p5_sv6h_realdem_cleaned
#   退役理由：写死 4/9 像元阈值；写死 100 m 单元面积；声称"ARR 2019 规定"（未核验）。
#   实测改动量：res.max 湿面积 −36.56%（271.07→171.97 km²）、水量 −53.16%（168.43→78.90 Mm³）。
#   目录保留为历史证据，但不得作为默认层或对外成果展示。

