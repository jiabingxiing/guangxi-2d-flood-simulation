# 前端固定版本（禁止 latest / 运行时 CDN）；tarball_sha256 为 npm 包原始哈希，下载后必须核对
schema_version: "1.0"
# 选择理由：MapLibre 5.24.0 仍提供单文件 UMD 构建（dist/maplibre-gl.js），
# 不需要打包器即可 <script> 引入，符合"纯静态、无 Node 构建链"的首版约束。
packages:
