    target_dir: "web/vendor/maplibre"
    files:
      - {src: "package/dist/maplibre-gl.js", dst: "maplibre-gl.js"}
      - {src: "package/dist/maplibre-gl.css", dst: "maplibre-gl.css"}
      - {src: "package/LICENSE.txt", dst: "LICENSE.txt"}
  - name: proj4
    version: "2.22.0"
    license: "MIT"
    url: "https://registry.npmjs.org/proj4/-/proj4-2.22.0.tgz"
    tarball_sha256: "7192ce47111f28ae8c47a39b583ea419202fbc216fe6303117cb1567b42e52d7"
    target_dir: "web/vendor/proj4"
    files:
      - {src: "package/dist/proj4.js", dst: "proj4.js"}
      - {src: "package/LICENSE.md", dst: "LICENSE.txt"}
