[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "floodviz"
version = "0.1.0"
description = "广西久隆/宁明/贵港二维洪涝可视化发布工程（只读父项目模型输出）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "rasterio>=1.5",
    "pyproj>=3.8",
    "pyyaml>=6.0",
    "pillow>=11.0",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "playwright>=1.47",
]

[project.scripts]
floodviz = "floodviz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/floodviz"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/002/003：中文注释与文档字符串中的全角标点属正常用法，不视为混淆字符
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: 慢测试（大图/全量发布，默认排除）",
    "e2e: 浏览器端到端测试（需 playwright chromium）",
]
