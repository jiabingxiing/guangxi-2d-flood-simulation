<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3e88"/>
      <stop offset="50%" stop-color="#1658b8"/>
      <stop offset="100%" stop-color="#1677ff"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b3e88" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Vortex Swirl Emblem -->
  <g transform="translate(32, 32) scale(0.9) translate(-32, -32)" filter="url(#softGlow)">
    <!-- Top-Right to Center-Left Swirl -->
    <path d="M 32 8 C 45 8, 54 18, 54 30 C 54 38, 48 45, 40 48 C 42 42, 44 36, 44 30 C 44 22, 38 16, 30 16 C 24 16, 18 19, 14 24 C 18 14, 25 8, 32 8 Z" fill="url(#blueGrad)"/>
    
    <!-- Bottom-Left to Center-Right Swirl -->
    <path d="M 32 56 C 19 56, 10 46, 10 34 C 10 26, 16 19, 24 16 C 22 22, 20 28, 20 34 C 20 42, 26 48, 34 48 C 40 48, 46 45, 50 40 C 46 50, 39 56, 32 56 Z" fill="url(#blueGrad)"/>
    
    <!-- Center 4 Power/Hydro Graduations -->
    <line x1="24" y1="26" x2="33" y2="26" stroke="#0b3e88" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="23" y1="30" x2="35" y2="30" stroke="#0b3e88" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="23" y1="34" x2="35" y2="34" stroke="#0b3e88" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25" y1="38" x2="33" y2="38" stroke="#0b3e88" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="29" y1="23" x2="29" y2="41" stroke="#0b3e88" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
